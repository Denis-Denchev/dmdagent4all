services:
  dmdcore:
    build:
      context: .
    image: dmdcore:local
    ports:
      - "8765:8765"
    environment:
      XDG_DATA_HOME: /data
      DMDCORE_STATIC_DIR: /app/frontend/dist
      DMDCORE_WORKSPACE: /workspace
      DMDCORE_OLLAMA_BASE_URL: http://ollama:11434
      DMDCORE_OLLAMA_MODEL: ${DMDCORE_OLLAMA_MODEL:-qwen3:4b}
      DMDCORE_PULL_MODEL: ${DMDCORE_PULL_MODEL:-1}
      DMDCORE_GMAIL_USERNAME: ${DMDCORE_GMAIL_USERNAME:-}
      DMDCORE_GMAIL_APP_PASSWORD: ${DMDCORE_GMAIL_APP_PASSWORD:-}
      DMDCORE_GMAIL_FROM: ${DMDCORE_GMAIL_FROM:-}
      DMDCORE_OUTLOOK_USERNAME: ${DMDCORE_OUTLOOK_USERNAME:-}
      DMDCORE_OUTLOOK_APP_PASSWORD: ${DMDCORE_OUTLOOK_APP_PASSWORD:-}
      DMDCORE_OUTLOOK_FROM: ${DMDCORE_OUTLOOK_FROM:-}
    volumes:
      - dmdcore_data:/data
      - ./workspace:/workspace
    depends_on:
      - ollama
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  dmdcore_data:
  ollama_data:
