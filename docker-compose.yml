services:
  dmdagent:
    build:
      context: .
    image: dmdagent4all:local
    ports:
      - "8765:8765"
    environment:
      XDG_DATA_HOME: /data
      DMDAGENT_STATIC_DIR: /app/frontend/dist
      DMDAGENT_WORKSPACE: /workspace
      DMDAGENT_OLLAMA_BASE_URL: http://ollama:11434
      DMDAGENT_OLLAMA_MODEL: ${DMDAGENT_OLLAMA_MODEL:-qwen3:4b}
      DMDAGENT_PULL_MODEL: ${DMDAGENT_PULL_MODEL:-1}
    volumes:
      - dmdagent_data:/data
      - ./workspace:/workspace
    depends_on:
      - ollama
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  dmdagent_data:
  ollama_data:
