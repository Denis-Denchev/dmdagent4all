llm:
  provider: ollama
  model: qwen3:8b
  planner_model:
  base_url: http://localhost:11434
  api_key_env:
  mode: fast
  response_language: auto
  planner_max_tokens: 192
  planner_temperature: 0.0
  planner_think: false

privacy:
  local_first: true
  cloud_models_disabled_by_default: true
  never_send_email_body_to_cloud: true
  never_send_calendar_details_to_cloud: true
  redact_secrets: true
  require_approval_for_cloud_context: true

terminal:
  enabled: false
  mode: allowlist
  workspace_only: true
  timeout_seconds: 30
  max_output_chars: 20000
  auto_approve_allowlisted: false
  workspace_root: ""
  allowed_commands:
    - [pwd]
    - [ls]
    - [git, status]
    - [git, diff]
    - [cat, README.md]
    - [cat, readme.md]
    - [npm, test]
    - [pytest]

browser:
  enabled: false
  isolated_profile: true
  downloads_to_workspace: true
  approval_required_for_submit: true
  timeout_seconds: 15
  max_response_bytes: 1000000
  max_text_chars: 12000

email:
  max_body_chars: 20000
  gmail:
    enabled: false
    imap_host: imap.gmail.com
    imap_port: 993
    smtp_host: smtp.gmail.com
    smtp_port: 587
    username_env: DMDCORE_GMAIL_USERNAME
    password_env: DMDCORE_GMAIL_APP_PASSWORD
    from_env: DMDCORE_GMAIL_FROM
    mailbox: INBOX
    archive_mailbox: "[Gmail]/All Mail"
  outlook:
    enabled: false
    imap_host: outlook.office365.com
    imap_port: 993
    smtp_host: smtp.office365.com
    smtp_port: 587
    username_env: DMDCORE_OUTLOOK_USERNAME
    password_env: DMDCORE_OUTLOOK_APP_PASSWORD
    from_env: DMDCORE_OUTLOOK_FROM
    mailbox: INBOX
    archive_mailbox: Archive

tools: {}

openai_usage:
  limit_usd:

permissions:
  granted: []
  approval_required_at_risk: 3

runtime:
  emergency_stop:
    active: false
    triggered_at: ""
    reason: ""

setup:
  completed: false
  agent_name: DMD Agent
  user_name: ""
  preferred_language: auto

interfaces:
  ui_language: en
  telegram:
    enabled: false
    allowed_user_ids: []
    bot_token_env: DMDCORE_TELEGRAM_BOT_TOKEN
    polling_timeout_seconds: 30
  whatsapp:
    enabled: false
    allowed_user_ids: []
