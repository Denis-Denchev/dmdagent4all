llm:
  provider: ollama
  model: qwen3:8b
  planner_model:
  base_url: http://localhost:11434
  api_key_env:
  mode: fast
  response_language: auto
  planner_max_tokens: 192
  planner_temperature: 0.0
  planner_think: false

privacy:
  local_first: true
  cloud_models_disabled_by_default: true
  never_send_email_body_to_cloud: true
  never_send_calendar_details_to_cloud: true
  redact_secrets: true
  require_approval_for_cloud_context: true

terminal:
  enabled: false
  mode: allowlist
  workspace_only: true
  timeout_seconds: 30
  max_output_chars: 20000
  allowed_commands:
    - [pwd]
    - [ls]
    - [git, status]
    - [git, diff]
    - [npm, test]
    - [pytest]

browser:
  enabled: false
  isolated_profile: true
  downloads_to_workspace: true
  approval_required_for_submit: true

tools: {}

permissions:
  granted: []
  approval_required_at_risk: 3

setup:
  completed: false
  agent_name: DMD Agent
  user_name: ""
  preferred_language: auto

interfaces:
  ui_language: en
  telegram:
    enabled: false
    allowed_user_ids: []
    bot_token_env: DMDAGENT_TELEGRAM_BOT_TOKEN
    polling_timeout_seconds: 30
  whatsapp:
    enabled: false
    allowed_user_ids: []
