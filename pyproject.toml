[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dmd-sentinel"
version = "1.0.0"
description = "DMD Sentinel — local-first AI control center with explicit tool permissions."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "DMDFlow" }
]
dependencies = [
  "fastapi>=0.115.0",
  "pyyaml>=6.0.0",
  "uvicorn[standard]>=0.30.0"
]

[project.optional-dependencies]
browser = [
  "playwright>=1.52.0"
]

[project.urls]
Homepage = "https://github.com/Denis-Denchev/dmd-sentinel"
Repository = "https://github.com/Denis-Denchev/dmd-sentinel"

[project.scripts]
dmd-sentinel = "dmdcore.cli:main"
dmdcore = "dmdcore.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dmdcore = ["manifests/tools/*.json"]
